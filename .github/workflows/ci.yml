name: CI

on:
  push:
    branches: [main]
    tags: ['v*', 'editor-xml-v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Determine versions + publish target
        id: version
        run: |
          REF="${{ github.ref }}"

          # Always compute each project's latest stable tag base.
          PLATFORM_TAG=$(git describe --tags --abbrev=0 --match='v*' --exclude='editor-xml-v*' 2>/dev/null || echo "v0.0.0")
          EDITOR_XML_TAG=$(git describe --tags --abbrev=0 --match='editor-xml-v*' 2>/dev/null || echo "editor-xml-v0.0.0")
          PLATFORM_BASE="${PLATFORM_TAG#v}"
          EDITOR_XML_BASE="${EDITOR_XML_TAG#editor-xml-v}"

          # Default each version to its stable base. Tag/branch pushes refine below.
          PLATFORM_VERSION="$PLATFORM_BASE"
          EDITOR_XML_VERSION="$EDITOR_XML_BASE"
          PUBLISH_PROJECT=""

          if [[ "$REF" == refs/tags/editor-xml-v* ]]; then
            # Publishing Editor.Xml — pin its version exactly to the tag, leave Phoenixml.Platform at stable base.
            EDITOR_XML_VERSION="${REF#refs/tags/editor-xml-v}"
            PUBLISH_PROJECT="Phoenixml.Platform.Editor.Xml"
          elif [[ "$REF" == refs/tags/v* ]]; then
            # Publishing Phoenixml.Platform — pin its version exactly to the tag, leave Editor.Xml at stable base.
            PLATFORM_VERSION="${REF#refs/tags/v}"
            PUBLISH_PROJECT="Phoenixml.Platform"
          else
            # Branch push: append commits-since-last-tag for visibility (artifacts only, not published).
            PLATFORM_COMMITS=$(git rev-list --count "${PLATFORM_TAG}..HEAD" 2>/dev/null || git rev-list --count HEAD)
            EDITOR_XML_COMMITS=$(git rev-list --count "${EDITOR_XML_TAG}..HEAD" 2>/dev/null || git rev-list --count HEAD)
            [[ "$PLATFORM_COMMITS" != "0" ]] && PLATFORM_VERSION="${PLATFORM_BASE}.${PLATFORM_COMMITS}"
            [[ "$EDITOR_XML_COMMITS" != "0" ]] && EDITOR_XML_VERSION="${EDITOR_XML_BASE}.${EDITOR_XML_COMMITS}"
          fi

          echo "platform_version=${PLATFORM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "editor_xml_version=${EDITOR_XML_VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish_project=${PUBLISH_PROJECT}" >> "$GITHUB_OUTPUT"
          echo "Versions: Platform=${PLATFORM_VERSION}, Editor.Xml=${EDITOR_XML_VERSION}, Publish=${PUBLISH_PROJECT:-<none>}"

      - name: Restore
        run: dotnet restore

      - name: Build (per-project versions so ProjectReferences resolve to the correct dep version)
        env:
          PLATFORM_VERSION: ${{ steps.version.outputs.platform_version }}
          EDITOR_XML_VERSION: ${{ steps.version.outputs.editor_xml_version }}
        run: |
          dotnet build src/Phoenixml.Platform -c Release --no-restore -p:Version="$PLATFORM_VERSION"
          dotnet build src/Phoenixml.Platform.Editor.Xml -c Release --no-restore -p:Version="$EDITOR_XML_VERSION"
          # Tests, arch tests, spike — versions don't matter for these.
          dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

      - name: Pack
        if: github.event_name == 'push'
        env:
          PUBLISH_PROJECT: ${{ steps.version.outputs.publish_project }}
          PLATFORM_VERSION: ${{ steps.version.outputs.platform_version }}
          EDITOR_XML_VERSION: ${{ steps.version.outputs.editor_xml_version }}
        run: |
          mkdir -p ./artifacts
          # When packing Editor.Xml, PhoenixmlPlatformDepVersion pins the nuspec
          # dependency on Phoenixml.Platform to the stable base version, isolated
          # from the build's global -p:Version (see csproj for the seam).
          if [[ "$PUBLISH_PROJECT" == "Phoenixml.Platform" ]]; then
            dotnet pack src/Phoenixml.Platform -c Release --no-build \
              -p:Version="$PLATFORM_VERSION" -p:PackageVersion="$PLATFORM_VERSION" -o ./artifacts
          elif [[ "$PUBLISH_PROJECT" == "Phoenixml.Platform.Editor.Xml" ]]; then
            dotnet pack src/Phoenixml.Platform.Editor.Xml -c Release --no-build \
              -p:Version="$EDITOR_XML_VERSION" -p:PackageVersion="$EDITOR_XML_VERSION" \
              -p:PhoenixmlPlatformDepVersion="$PLATFORM_VERSION" -o ./artifacts
          else
            # Branch push — pack both for artifact archival; publish job is gated and won't run.
            dotnet pack src/Phoenixml.Platform -c Release --no-build \
              -p:Version="$PLATFORM_VERSION" -p:PackageVersion="$PLATFORM_VERSION" -o ./artifacts
            dotnet pack src/Phoenixml.Platform.Editor.Xml -c Release --no-build \
              -p:Version="$EDITOR_XML_VERSION" -p:PackageVersion="$EDITOR_XML_VERSION" \
              -p:PhoenixmlPlatformDepVersion="$PLATFORM_VERSION" -o ./artifacts
          fi

      - name: Upload artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

  publish:
    needs: build
    # Only publish on tagged releases. Untagged main pushes still pack and upload
    # the artifact so it's available for local download + manual publish via
    # `dotnet nuget push --api-key "$PHOENIXML_NUGET_API"` if CI publish ever fails.
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/editor-xml-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Push to NuGet
        env:
          NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for pkg in ./artifacts/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
